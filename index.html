<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天水圍新市鎮規劃模擬器</title>

  <!-- React & ReactDOM CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MAX_TURNS = 8;
    const INITIAL_BUDGET = 1000;
    const TAX_REVENUE = 150;

    const ZONES = [
      { id: 0, name: '南部生活區', tag: '建議: 住宅/學校', icon: '🏡' },
      { id: 1, name: '核心商業區', tag: '建議: 街市商場', icon: '🛒' },
      { id: 2, name: '西部動脈區', tag: '建議: 綜合醫院', icon: '🏥' },
      { id: 3, name: '南端交通樞紐', tag: '建議: 屯馬線鐵路', icon: '🚆' },
      { id: 4, name: '中央綠肺區', tag: '建議: 市鎮公園', icon: '🦆' },
      { id: 5, name: '北部后海灣生態區', tag: '建議: 濕地公園', icon: '🌳' }
    ];

    const playSFX = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'build') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {}
    };

    const FAMILY_MEMBERS = [
      { id: 'dad', name: '爸爸 (上班族)', needs: '交通', icon: '👔', avatarHappy: 'avatar_father_happy.png', avatarSad: 'avatar_father_stressed.png' },
      { id: 'mom', name: '媽媽 (主婦)', needs: '購物', icon: '👜', avatarHappy: 'avatar_mother_satisfied.png', avatarSad: 'avatar_mother_worried.png' },
      { id: 'grandpa', name: '爺爺 (長者)', needs: '醫療/休閒', icon: '👴', avatarHappy: 'avatar_grandfather_healthy.png', avatarSad: 'avatar_grandfather_sick.png' },
      { id: 'boy', name: '哥哥小皇', needs: '教育/玩樂', icon: '👦', avatarHappy: 'avatar_child_joyful.png', avatarSad: 'avatar_child_bored.png' },
      { id: 'girl', name: '妹妹小英', needs: '環境/自然', icon: '👧', avatarHappy: 'avatar_child_joyful.png', avatarSad: 'avatar_child_bored.png' }
    ];

    const BUILDINGS = {
      housing: { id: 'housing', name: '公共屋邨', cost: 150, upkeep: 10, icon: '🏢', img: 'building logo.png', desc: '基礎居住設施。全家人心情+10', color: 'bg-blue-100/90 border-blue-400 text-blue-700' },
      transport: { id: 'transport', name: '交通樞紐', cost: 250, upkeep: 20, icon: '🚆', img: 'train logo.png', desc: '解決跨區通勤問題。爸爸+40, 媽媽+20, 經濟+15', color: 'bg-slate-100/90 border-slate-400 text-slate-700' },
      commercial: { id: 'commercial', name: '大型街市', cost: 200, upkeep: 15, icon: '🛒', img: 'market logo.png', desc: '滿足日常購買食材的需要。媽媽+40, 經濟+30, 環境-10', color: 'bg-yellow-100/90 border-yellow-400 text-yellow-700' },
      hospital: { id: 'hospital', name: '綜合醫院', cost: 300, upkeep: 30, icon: '🏥', img: 'hospital logo.png', desc: '應付醫療需求。爺爺+50, 全家人+5', color: 'bg-red-50/90 border-red-400 text-red-700' },
      school: { id: 'school', name: '中小學校網', cost: 200, upkeep: 15, icon: '🏫', img: null, desc: '原區就學。哥哥+40, 妹妹+40', color: 'bg-orange-100/90 border-orange-400 text-orange-700' },
      park: { id: 'park', name: '濕地保育公園', cost: 150, upkeep: 10, icon: '🌳', img: 'wetland logo.png', desc: '保護生態。妹妹+30, 爺爺+20, 環境+40', color: 'bg-emerald-100/90 border-emerald-400 text-emerald-700' },
      pond: { id: 'pond', name: '市鎮公園', cost: 100, upkeep: 5, icon: '🦆', img: 'pond logo.png', desc: '休憩空間。全家人心情+5', color: 'bg-green-100/90 border-green-400 text-green-700' }
    };

    const QUIZ_POOL = [
      {
        question: "【歷史與地理】天水圍在發展成新市鎮之前，主要是什麼地形？",
        options: [
          { text: "主要是高山與森林", correct: false, feedback: "不對。天水圍早期並沒有高山。" },
          { text: "主要是低窪魚塘與濕地", correct: true, feedback: "答對了！天水圍原為低窪濕地魚塘，發展時需兼顧生態平衡。" },
          { text: "主要是商業高樓集中地", correct: false, feedback: "不對。發展前這裡主要是鄉郊地區。" }
        ]
      },
      {
        question: "【居民觀察】如果居民每天要花兩小時跨區到港島上班，會帶來什麼影響？",
        options: [
          { text: "增加居民車費開支與時間成本，生活質素下降", correct: true, feedback: "答對了！交通不便會嚴重影響居民的作息和心情。" },
          { text: "完全沒有影響，居民都很享受乘坐長途車", correct: false, feedback: "長途通勤會令人身心疲倦呢！" }
        ]
      },
      {
        question: "【發展與保育】興建大型購物商場雖然能方便購物，但可能會帶來什麼負面影響？",
        options: [
          { text: "增加綠化面積，改善空氣質素", correct: false, feedback: "商業發展通常會佔用土地，並減少綠化空間。" },
          { text: "產生較多廢物與噪音，影響原有的自然環境", correct: true, feedback: "答對了！發展經濟與保護環境往往需要取得平衡。" }
        ]
      }
    ];

    const generateRunQuizzes = () => {
      const shuffled = [...QUIZ_POOL].sort(() => 0.5 - Math.random());
      return { 2: shuffled[0], 4: shuffled[1], 6: shuffled[2] };
    };

    function App() {
      const [showCover, setShowCover] = useState(true);
      const [className, setClassName] = useState('4A');
      const [studentName, setStudentName] = useState('陳小明');

      const [turn, setTurn] = useState(1);
      const [budget, setBudget] = useState(INITIAL_BUDGET);
      const [plots, setPlots] = useState(Array(6).fill(null));
      const [builtThisTurn, setBuiltThisTurn] = useState(false);
      const [turnQuizzes, setTurnQuizzes] = useState(generateRunQuizzes());
      
      const [budgetPulse, setBudgetPulse] = useState(false);
      
      const [moods, setMoods] = useState({ dad: 50, mom: 50, grandpa: 50, boy: 50, girl: 50 });
      const [env, setEnv] = useState(50);
      const [econ, setEcon] = useState(30);
      const [selectedPlot, setSelectedPlot] = useState(null);
      const [log, setLog] = useState(["歡迎來到天水圍！請開始您的規劃。"]);
      const [cooldown, setCooldown] = useState(0);
      
      const [modal, setModal] = useState({ isOpen: false, type: '', title: '', text: '', image: null, options: [] });
      const [modalImgError, setModalImgError] = useState(false);
      const [quizModal, setQuizModal] = useState({ isOpen: false, data: null, selectedOpt: null });
      const [soundEnabled, setSoundEnabled] = useState(true);

      const triggerSFX = (type) => { if (soundEnabled) playSFX(type); };
      const addLog = (msg) => { setLog(prev => [msg, ...prev].slice(0, 50)); };

      useEffect(() => {
        if (cooldown > 0) {
          const timer = setTimeout(() => setCooldown(c => c - 1), 1000);
          return () => clearTimeout(timer);
        }
      }, [cooldown]);

      const canAdvance = cooldown === 0;
      
      const openModal = (config) => {
        setModalImgError(false);
        setModal({ isOpen: true, ...config });
      };

      const closeModal = () => {
        setModalImgError(false);
        setModal({ isOpen: false, type: '', title: '', text: '', image: null, options: [] });
      };

      const updateMoods = (changes) => {
        setMoods(prev => {
          let newMoods = { ...prev };
          for (const [key, val] of Object.entries(changes)) {
            if (newMoods[key] !== undefined) {
              newMoods[key] = Math.max(0, Math.min(100, newMoods[key] + val));
            }
          }
          return newMoods;
        });
      };

      const updateStats = (envChange, econChange) => {
        setEnv(prev => Math.max(0, Math.min(100, prev + envChange)));
        setEcon(prev => Math.max(0, Math.min(100, prev + econChange)));
      };

      const handleBuild = (buildingKey) => {
        const building = BUILDINGS[buildingKey];
        if (budget < building.cost) {
          triggerAlert("預算不足", `您需要 ${building.cost} 資金來興建 ${building.name}。`);
          return;
        }

        setBudget(prev => prev - building.cost);
        let newPlots = [...plots];
        newPlots[selectedPlot] = buildingKey;
        setPlots(newPlots);

        const zoneName = ZONES[selectedPlot].name;
        setSelectedPlot(null);
        setBuiltThisTurn(true);
        triggerSFX('build');

        let moodChanges = {};
        if (buildingKey === 'housing') moodChanges = { dad: 10, mom: 10, grandpa: 10, boy: 10, girl: 10 };
        if (buildingKey === 'transport') { moodChanges = { dad: 40, mom: 20 }; updateStats(0, 15); }
        if (buildingKey === 'commercial') { moodChanges = { mom: 40 }; updateStats(-10, 30); }
        if (buildingKey === 'hospital') { moodChanges = { grandpa: 50, dad: 5, mom: 5, boy: 5, girl: 5 }; }
        if (buildingKey === 'school') { moodChanges = { boy: 40, girl: 40 }; }
        if (buildingKey === 'park') { moodChanges = { girl: 30, grandpa: 20 }; updateStats(40, 0); }

        updateMoods(moodChanges);
        addLog(`[建設] 在【${zoneName}】興建了 ${building.name}！`);
      };

      const handleEndTurnClick = () => {
        if (!builtThisTurn && plots.includes(null) && budget >= 150) {
          openModal({
            type: 'warning',
            title: "⚠️ 警告：本年度未有任何規劃！",
            text: "您今年完全沒有興建任何設施！直接跳過年份會導致居民失望且心情下降。您確定要直接結束本年嗎？",
            image: null,
            options: [
              { label: "返回規劃（建議）", action: closeModal, color: "bg-blue-600 hover:bg-blue-700" },
              { label: "堅持跳過今年", action: () => { closeModal(); checkQuizOrAdvance(); }, color: "bg-gray-500 hover:bg-gray-600" }
            ]
          });
          return;
        }
        checkQuizOrAdvance();
      };

      const checkQuizOrAdvance = () => {
        if (turnQuizzes[turn]) {
          setQuizModal({ isOpen: true, data: turnQuizzes[turn], selectedOpt: null });
        } else {
          processAdvanceTurn();
        }
      };

      const processAdvanceTurn = () => {
        if (!builtThisTurn) {
          updateMoods({ dad: -10, mom: -10, grandpa: -10, boy: -10, girl: -10 });
          addLog("⚠️ 由於今年缺乏規劃，陳氏一家感到極度失望 (心情-10)。");
        }

        setBuiltThisTurn(false);
        setCooldown(5);

        let totalUpkeep = 0;
        plots.forEach(p => { if (p) totalUpkeep += BUILDINGS[p].upkeep; });

        const netIncome = TAX_REVENUE - totalUpkeep;
        const newBudget = budget + netIncome;
        setBudget(newBudget);

        setBudgetPulse(true);
        setTimeout(() => setBudgetPulse(false), 1200);

        updateMoods({ dad: -5, mom: -5, grandpa: -5, boy: -5, girl: -5 });
        
        if (newBudget < 0) {
          triggerEndGame('bankrupt');
          return;
        }

        const nextYear = turn + 1;
        setTurn(nextYear);
        addLog(`[第${nextYear}年] 收取稅收 +${TAX_REVENUE}，設施維護費 -${totalUpkeep}。`);

        if (nextYear > MAX_TURNS) {
          triggerEndGame('normal');
          return;
        }

        if (nextYear === 2) {
          if (!plots.includes('transport')) {
            updateMoods({ dad: -25 });
            triggerAlert("⚠️ 青山公路大塞車", "公路嚴重塞車，巴士站大排長龍！爸爸上班經常遲到。(爸爸心情大跌)", "event_traffic_jam.png");
          }
        } else if (nextYear === 3) {
          if (!plots.includes('school')) {
            updateMoods({ boy: -30, girl: -30 });
            triggerAlert("⚠️ 跨區上學之苦", "小皇和小英每天要花兩小時跨區上學，身心俱疲！(哥哥、妹妹心情大跌)", "event_cross_district_school.png");
          }
        } else if (nextYear === 4) {
          if (!plots.includes('hospital')) {
            updateMoods({ grandpa: -30 });
            triggerAlert("⚠️ 冬季流感小診所癱瘓", "季節性流感爆發，街角診所擠滿病人，長者就醫困難！(爺爺心情下降)", "event_winter_flu_clinic.png");
          }
        } else if (nextYear === 5) {
          if (!plots.includes('hospital')) {
            updateMoods({ grandpa: -40 });
            triggerAlert("⚠️ 深夜心絞痛急救事件", "爺爺半夜胸口不適！由於區內缺乏急症綜合醫院，急救車需跨區長途狂飆！", "event_midnight_emergency.png");
          }
        } else if (nextYear === 6) {
          triggerConservationDilemma();
        } else if (nextYear === 7) {
          if (plots.includes('pond') || plots.includes('park')) {
            updateMoods({ dad: 15, mom: 15, grandpa: 15, boy: 20, girl: 20 });
            triggerAlert("🚴 天水圍單車節嘉年華", "全家人在公園湖畔與綠樹下騎單車野餐，共度歡樂時光！", "event_park_cycling_festival.png");
          }
        } else if (nextYear === 8) {
          if (plots.includes('park')) {
            updateMoods({ girl: 30 });
            updateStats(20, 0);
            triggerAlert("𓅞 黑臉琵鷺降臨濕地", "珍稀黑臉琵鷺飛抵天水圍濕地公園！展現發展與保育和諧共存的奇蹟！", "event_spoonbill_arrival.png");
          }
        }
      };

      const triggerConservationDilemma = () => {
        openModal({
          type: 'dilemma',
          title: "⚖️ 發展與保育的抉擇",
          text: "有地產商提議出資500萬填平魚塘發展豪宅高樓，這會帶來巨額收入，但會破壞自然生態。您會如何選擇？",
          image: "event_fishpond_dilemma.png",
          options: [
            {
              label: "發展豪宅 (資金+300, 環境-40, 妹妹-20)",
              action: () => {
                setBudget(prev => prev + 300);
                updateStats(-40, 20);
                updateMoods({ girl: -20 });
                addLog("決定：選擇發展豪宅，獲得資金，但犧牲了生態環境。");
                closeModal();
              },
              color: "bg-amber-600 hover:bg-amber-700"
            },
            {
              label: "保育濕地 (資金-100, 環境+40, 妹妹+20)",
              action: () => {
                setBudget(prev => prev - 100);
                updateStats(40, -10);
                updateMoods({ girl: 20 });
                addLog("決定：選擇保育濕地，堅持可持續發展，環境大幅改善。");
                closeModal();
              },
              color: "bg-emerald-600 hover:bg-emerald-700"
            }
          ]
        });
      };

      const triggerEndGame = (reason) => {
        let title = "";
        let desc = "";
        let endingImg = null;
        
        if (reason === 'bankrupt') {
          title = "❌ 破產免職！";
          desc = `${className} ${studentName} 署長耗盡了所有城市建設基金，無力支付設施維護費。天水圍新市鎮計劃宣告失敗。`;
          endingImg = "bg_ending_concrete_jungle.png";
        } else {
          const avgMood = Object.values(moods).reduce((a, b) => a + b, 0) / 5;
          if (avgMood >= 70 && env >= 60) {
            title = "🏆 五星級自給自足典範城！";
            desc = `太棒了，${className} ${studentName} 署長！您成功平衡了各方需求，天水圍成為了兼具綠色生態與完善設施的夢幻新市鎮！陳氏一家非常幸福！`;
            endingImg = "bg_ending_ideal_town.png";
          } else if (avgMood >= 50 && env < 40) {
            title = "🏢 水泥森林浩劫";
            desc = `雖然 ${studentName} 署長解決了部分民生需求，但過度發展導致環境被破壞。這是一座失去靈魂的水泥森林，居民感到壓抑。`;
            endingImg = "bg_ending_concrete_jungle.png";
          } else if (avgMood < 50) {
            title = "🥺 悲情城市... 孤島睡城";
            desc = "設施嚴重不足，居民生活充滿怨言。跨區通勤與醫療短缺讓這個家庭苦不堪言，規劃有待改善。";
            endingImg = "bg_ending_traffic_gridlock.png";
          } else {
            title = "✅ 發展中新市鎮";
            desc = `恭喜 ${className} ${studentName} 署長完成了8年的任期！天水圍有了一定的發展，但仍有進步空間。感謝您的努力！`;
            endingImg = "bg_ending_ideal_town.png";
          }
        }

        openModal({
          type: 'end',
          title: title,
          text: desc,
          image: endingImg,
          options: [{ label: "重新開始遊戲", action: resetGame, color: "bg-blue-600 hover:bg-blue-700" }]
        });
      };

      const resetGame = () => {
        setTurn(1);
        setBudget(INITIAL_BUDGET);
        setPlots(Array(6).fill(null));
        setMoods({ dad: 50, mom: 50, grandpa: 50, boy: 50, girl: 50 });
        setEnv(50);
        setEcon(30);
        setBuiltThisTurn(false);
        setCooldown(5);
        setTurnQuizzes(generateRunQuizzes());
        setLog([`遊戲已重置。歡迎 ${className} ${studentName} 署長開始您的新任期！`]);
        closeModal();
      };

      const triggerAlert = (title, text, image = null) => {
        openModal({
          type: 'alert',
          title: title,
          text: text,
          image: image,
          options: [{ label: "確認", action: closeModal, color: "bg-blue-600 hover:bg-blue-700" }]
        });
      };

      const MoodBar = ({ val }) => {
        let color = 'bg-red-500';
        if (val > 40) color = 'bg-yellow-400';
        if (val > 70) color = 'bg-green-500';
        return (
          <div className="w-full bg-gray-200 rounded-full h-2.5 mt-1 border border-gray-300 shadow-inner">
            <div className={`${color} h-2.5 rounded-full transition-all duration-500`} style={{ width: `${val}%` }}></div>
          </div>
        );
      };

      if (showCover) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 font-sans flex flex-col justify-between p-4 md:p-8 relative overflow-hidden">
            <div 
              className="absolute inset-0 bg-cover bg-center opacity-35 pointer-events-none" 
              style={{ backgroundImage: `url('bg_game_cover_title.png'), url('bg_tin_shui_wai_map.png')` }}
            ></div>
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <header className="max-w-4xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-800/80 backdrop-blur-md p-4 rounded-2xl border border-slate-700/80 shadow-lg z-10">
              <div className="flex items-center gap-3">
                <div className="bg-emerald-500 text-slate-900 text-2xl p-2.5 rounded-xl font-black shadow-md">
                  🏫

              <button

            <div className="flex items-center gap-3">

              >

              </button>
              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                className="bg-emerald-800 hover:bg-emerald-900 text-emerald-100 p-2 rounded-lg text-xs font-semibold border border-emerald-600 transition"

              <div>
                <h1 className="text-xl md:text-2xl font-bold tracking-wider flex items-center gap-2">

                </h1>
                <p className="text-emerald-200 text-xs md:text-sm font-medium">
                  署長: <span className="text-yellow-300 font-bold">{className} {studentName}</span> | 英皇書院同學會小學

                <div className="text-2xl font-black">{turn} <span className="text-base font-normal">/ {MAX_TURNS}</span></div>

              <div className="w-px h-10 bg-emerald-600/50"></div>

                <div className={`text-2xl font-black transition-transform duration-300 ${budgetPulse ? 'scale-125 text-yellow-100' : ''} ${budget < 200 ? 'text-red-300' : 'text-yellow-300'}`}>

                    const currentMood = moods[member.id];
                    const avatarSrc = currentMood > 50 ? member.avatarHappy : member.avatarSad;
                    return (
                      <div key={member.id} className="flex items-center gap-3 bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <div className="w-12 h-12 rounded-full flex items-center justify-center bg-white border border-slate-200 overflow-hidden shadow-sm flex-shrink-0">
                          <img 
                            src={avatarSrc} 
                            alt={member.name}
                            className="w-full h-full object-cover"
                            onError={(e) => {
                              e.target.style.display = 'none';
                              if (e.target.parentNode) {
                                e.target.parentNode.innerHTML = `<span class="text-2xl">${member.icon}</span>`;
                              }
                            }}
                          />
                        </div>
                        <div className="flex-1">
                          <div className="flex justify-between text-sm">
                            <span className="font-semibold">{member.name}</span>
                            <span className="text-slate-500 text-xs">重視:{member.needs}</span>
                          </div>
                          <MoodBar val={currentMood} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

              <section className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                   <span className="text-emerald-500">📊</span> 城市指標
                </h2>
                <div className="space-y-3">
                  <div>
                    <div className="flex justify-between text-sm font-semibold mb-1">
                      <span className="text-emerald-700">🌲 生態環境</span>
                      <span>{env}/100</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2 shadow-inner">

                    </div>
                  </div>
                  <div>
                    <div className="flex justify-between text-sm font-semibold mb-1">
                      <span className="text-yellow-600">📈 經濟繁榮</span>
                      <span>{econ}/100</span>

                    <div className="w-full bg-slate-200 rounded-full h-2 shadow-inner">
                      <div className="bg-yellow-500 h-2 rounded-full" style={{ width: `${econ}%` }}></div>
                    </div>

              </section>

              className="flex-1 p-6 flex flex-col relative overflow-hidden bg-cover bg-center"

              }}

                      : 'bg-slate-300 text-slate-500 cursor-not-allowed border border-slate-400'

                      key={idx} 
                      onClick={() => !plot && setSelectedPlot(idx)}

                                <img 
                                  src={BUILDINGS[plot].img}

                            ) : (
                              <span className="text-4xl md:text-5xl filter drop-shadow-md">{BUILDINGS[plot].icon}</span>
                            )}

                          <span className="font-bold text-center text-xs bg-white/90 px-2 py-0.5 rounded-full z-10 shadow-sm">{BUILDINGS[plot].name}</span>

                            ? 'bg-blue-600 text-white hover:bg-blue-700' 
                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        }`}
                      >
                        {budget >= b.cost ? '興建於此區域' : '資金不足'}
                      </button>
                    </div>
                  ))}
                </div>
              </aside>

                <p className="text-slate-800 text-base font-semibold mb-6 bg-blue-50 p-4 rounded-xl border border-blue-100">

                      className={`w-full p-3 rounded-xl border text-left text-sm font-medium transition-all ${
                        quizModal.selectedOpt === opt

                          : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700'
                      }`}
                    >
                      {opt.text}
                    </button>
                  ))}
                </div>

                {quizModal.selectedOpt && (
                  <div className={`p-3 rounded-xl text-xs font-bold mb-4 ${quizModal.selectedOpt.correct ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                    {quizModal.selectedOpt.feedback}
                  </div>
                )}

                <div className="flex justify-end">
                  <button
                    disabled={!quizModal.selectedOpt}
                    onClick={() => {
                      setQuizModal({ isOpen: false, data: null, selectedOpt: null });

                    className={`px-6 py-2 rounded-xl text-white font-bold text-sm ${
                      quizModal.selectedOpt 
                        ? 'bg-blue-600 hover:bg-blue-700 cursor-pointer' 
                        : 'bg-slate-300 text-slate-500 cursor-not-allowed'
                    }`}
                  >
                    完成思考，進入下一年 ➔
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Universal Modal Overlay with Dynamic Fallback Header */}

            <div className="fixed inset-0 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">

                  <div className="w-full h-48 md:h-56 bg-slate-800 relative overflow-hidden flex items-center justify-center">
                    <img
                      src={modal.image}
                      alt={modal.title}
                      className="w-full h-full object-cover"
                      onError={() => setModalImgError(true)}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-900/30 to-transparent"></div>
                    <div className="absolute bottom-3 left-4 right-4 text-white font-black text-lg drop-shadow-md flex items-center gap-2">
                      {modal.type === 'end' ? '📊 最終任期報告' : '📰 社區事件'}

                  </div>
                ) : (
                  <div className={`w-full py-6 px-6 bg-gradient-to-r flex items-center justify-between border-b ${
                    modal.type === 'dilemma' 
                      ? 'from-amber-500 to-orange-600 text-white' 
                      : modal.type === 'end' 
                        ? 'from-indigo-600 to-blue-700 text-white' 
                        : 'from-emerald-600 to-teal-700 text-white'
                  }`}>
                    <div className="font-extrabold text-xl flex items-center gap-2">
                      {modal.type === 'dilemma' && '⚖️ 政策抉擇考驗'}
                      {modal.type === 'end' && '🏆 規劃任期報告'}
                      {modal.type === 'alert' && '📰 社區緊急動態'}
                      {modal.type === 'warning' && '⚠️ 規劃提醒'}
                    </div>
                    <span className="text-3xl opacity-80">
                      {modal.type === 'dilemma' ? '🏞️' : modal.type === 'end' ? '🏛️' : '📣'}
                    </span>
                  </div>
                )}

                <div className="p-6">
                  <h3 className={`text-2xl font-black mb-3 border-b pb-2 ${modal.type === 'warning' ? 'text-amber-600 border-amber-100' : 'text-slate-800 border-slate-100'}`}>
                    {modal.title}
                  </h3>
                  <p className="text-slate-600 text-base mb-6 leading-relaxed">
                    {modal.text}
                  </p>
                  <div className="flex flex-col gap-3">
                    {modal.options.map((opt, i) => (
                      <button
                        key={i}
                        onClick={opt.action}
                        className={`w-full py-3.5 px-4 rounded-xl text-white font-bold text-base shadow-md transition-transform transform active:scale-95 cursor-pointer ${opt.color}`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
